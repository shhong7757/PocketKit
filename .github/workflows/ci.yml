name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
      - name: Format Lint
        run: swift format lint --recursive --parallel --strict Package.swift Sources Tests
      - name: SwiftLint
        run: swiftlint lint --strict --no-cache
      - name: Build
        run: swift build
      - name: Test
        run: swift test
