name: Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Pages status
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          api_url="${GITHUB_API_URL:-https://api.github.com}"
          status=$(
            curl -L -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api_url/repos/$GITHUB_REPOSITORY/pages"
          )

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Enable Settings > Pages > Build and deployment > Source: GitHub Actions, then rerun this workflow."
          else
            echo "::error::Could not read GitHub Pages status. API returned HTTP $status."
            exit 1
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build DocC archive
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
          DOCS_OUTPUT_PATH: ${{ github.workspace }}/.build/docs-site
          SOURCE_BASE_URL: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}
        run: |
          mkdir -p "$(dirname "$DOCS_OUTPUT_PATH")"

          swift package \
            --package-path Tools/DocC \
            --allow-writing-to-directory "$DOCS_OUTPUT_PATH" \
            generate-documentation \
            --target PocketUI \
            --disable-indexing \
            --checkout-path "$GITHUB_WORKSPACE" \
            --source-service github \
            --source-service-base-url "$SOURCE_BASE_URL" \
            --hosting-base-path "$DOCS_BASE_PATH" \
            --transform-for-static-hosting \
            --output-path "$DOCS_OUTPUT_PATH" \
            --warnings-as-errors

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs-site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
