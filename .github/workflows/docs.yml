name: Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build DocC archive
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
          DOCS_OUTPUT_PATH: ${{ github.workspace }}/.build/docs-site
          SOURCE_BASE_URL: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}
        run: |
          swift package \
            --package-path Tools/DocC \
            --allow-writing-to-directory "$DOCS_OUTPUT_PATH" \
            generate-documentation \
            --target PocketUI \
            --disable-indexing \
            --checkout-path "$GITHUB_WORKSPACE" \
            --source-service github \
            --source-service-base-url "$SOURCE_BASE_URL" \
            --hosting-base-path "$DOCS_BASE_PATH" \
            --transform-for-static-hosting \
            --output-path "$DOCS_OUTPUT_PATH" \
            --warnings-as-errors

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
